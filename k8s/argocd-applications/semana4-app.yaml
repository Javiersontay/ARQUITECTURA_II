apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: semana4-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Javiersontay/ARQUITECTURA_II.git
    targetRevision: assignment-08
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: semana4
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
