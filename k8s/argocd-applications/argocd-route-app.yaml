apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-route
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Javiersontay/ARQUITECTURA_II.git
    targetRevision: assignment-08
    path: k8s/argocd-route
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
